<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masavtech | Yapım Aşamasında</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070b14;
      --card-bg: rgba(13, 20, 36, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #2c98f6;
      --primary-glow: rgba(44, 152, 246, 0.35);
      --accent: #00f0ff;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(44, 152, 246, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 85% 85%, rgba(0, 240, 255, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 15% 75%, rgba(99, 102, 241, 0.06) 0%, transparent 50%);
    }

    /* Ambient background grid */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex: 1;
      justify-content: center;
    }

    /* Brand Header Text Only */
    .brand-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 2.5rem;
      text-transform: uppercase;
    }

    .brand-title span {
      color: var(--primary);
    }

    /* Main Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 3.5rem 2.5rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      max-width: 620px;
      width: 100%;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Status Pill */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(44, 152, 246, 0.1);
      border: 1px solid rgba(44, 152, 246, 0.3);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #60a5fa;
      margin-bottom: 1.5rem;
      letter-spacing: 0.06em;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #38bdf8;
      border-radius: 50%;
      position: relative;
    }

    .status-dot::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background-color: #38bdf8;
      opacity: 0.6;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(2.2); opacity: 0; }
      100% { transform: scale(1); opacity: 0; }
    }

    h1 {
      font-size: clamp(1.85rem, 4.5vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.25;
      margin-bottom: 1.1rem;
      background: linear-gradient(180deg, #ffffff 30%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .description {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 2.25rem;
      font-weight: 400;
    }

    /* Progress bar */
    .progress-wrapper {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 1.1rem 1.25rem;
      text-align: left;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 0.65rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .progress-info span:last-child {
      color: var(--primary);
      font-weight: 700;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 85%;
      background: linear-gradient(90deg, #2c98f6, #00f0ff);
      border-radius: 9999px;
    }

    /* Footer */
    footer {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 640px) {
      .card {
        padding: 2.25rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <main class="container">
    <!-- Brand Title Only -->
    <div class="brand-title">
      MASAV<span>TECH</span>
    </div>

    <!-- Main Card -->
    <div class="card">
      <div class="status-badge">
        <div class="status-dot"></div>
        <span>YAPIM AŞAMASINDA</span>
      </div>

      <h1>Yenileniyoruz, Çok Yakında Buradayız!</h1>
      
      <p class="description">
        Yenilikçi teknolojiler ve modern dijital çözümlerle web sitemiz çok yakında yayında olacaktır.
      </p>

      <!-- Progress Section -->
      <div class="progress-wrapper">
        <div class="progress-info">
          <span>Geliştirme Durumu</span>
          <span>%85 Tamamlandı</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill"></div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    © <span id="year"></span> Masavtech Teknoloji A.Ş. Tüm hakları saklıdır.
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
